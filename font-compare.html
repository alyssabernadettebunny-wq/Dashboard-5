<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Parisienne&family=Meddon&family=Great+Vibes&family=Mrs+Saint+Delafield&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  body { background: linear-gradient(135deg,#FDF0F6,#EFE4FA); padding: 30px; font-family: sans-serif; }

  .label { width: 160px; font-size: 13px; color: #7B5FA6; font-weight: bold; }
  .sample { font-size: 42px; color: #6B4E96; }
</style>
</head>
<body>
  <div class="row"><div class="label">Dancing Script (current)</div><div class="sample" style="font-family:'Dancing Script'">Alyssa Daily Dashboard</div></div>
  <div class="row"><div class="label">Alex Brush</div><div class="sample" style="font-family:'Alex Brush'">Alyssa Daily Dashboard</div></div>
  <div class="row"><div class="label">Parisienne</div><div class="sample" style="font-family:'Parisienne'">Alyssa Daily Dashboard</div></div>
  <div class="row"><div class="label">Meddon</div><div class="sample" style="font-family:'Meddon'">Alyssa Daily Dashboard</div></div>
  <div class="row"><div class="label">Great Vibes</div><div class="sample" style="font-family:'Great Vibes'">Alyssa Daily Dashboard</div></div>
  <div class="row"><div class="label">Mrs Saint Delafield</div><div class="sample" style="font-family:'Mrs Saint Delafield'">Alyssa Daily Dashboard</div></div>
</body>
</html>
